# OS: Linux; Symfony: latest stable; PHP: all the commonly used versions supported by this bundle
name: "Tests"

on:
  pull_request:
  push:
    branches:
      - 'main'

env:
  fail-fast: true

jobs:
  javascript-tests:
    name: "JavaScript (Node.js 24)"
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7.0.1

      - name: 'Install Node.js'
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 'Run JavaScript tests'
        run: node --test tests/JavaScript/*.test.js

  tests:
    name: "PHP ${{ matrix.php-version }}"
    runs-on: 'ubuntu-latest'
    continue-on-error: false
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v7.0.1

      - name: 'Install PHP with extensions'
        uses: shivammathur/setup-php@2.37.1
        with:
          coverage: ${{ matrix.php-version == '8.5' && 'xdebug' || 'none' }}
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          extensions: mbstring, intl
          ini-values: date.timezone=UTC

      - name: 'Install project dependencies'
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-progress --no-scripts --no-plugins symfony/flex
          composer update --no-interaction --prefer-dist --optimize-autoloader --prefer-stable
          vendor/bin/simple-phpunit install

      - name: 'Run tests without coverage'
        if: matrix.php-version != '8.5'
        run: vendor/bin/phpunit --no-coverage

      - name: 'Run tests with coverage'
        if: matrix.php-version == '8.5'
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover ./coverage.xml

      - name: 'Upload coverage to Codacy'
        if: >-
          matrix.php-version == '8.5' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./coverage.xml
